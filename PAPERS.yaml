#
# STATUS values:
#   published         — live on Zenodo, current version is latest
#   needs-new-version — published but content changed; upload new version via Zenodo "New version"
#   pending-review    — PDF ready but content needs review before upload
#   pending-upload    — PDF ready; upload to Zenodo as new record
#
# FILE paths are relative to Dist/.
# DOI is the concept DOI (resolves to latest version).
