# Zenodo upload metadata for the [T]-Theory / Universal Somatic Field release registry.
# Keys match Dist/PAPERS.yaml ids. Titles and file paths are intentionally read
# from PAPERS.yaml by bin/zenodo-publish; this file supplies only Zenodo metadata
# that is not already in the registry. Public descriptions are deliberately
# hardened to the 2026-10-01 release facts: no hardware/D-Wave claims for
# QUANT-EXP-1, no file-level "0 sorries" claim for Lean, no claim that the
# programme is derived from M-theory, and simulations are named as simulations.

P1:
  upload_type: publication
  publication_type: article
  description: >-
    A formal field-theoretic model of emotional dynamics in which limbic and somatic state are represented as a tensor-valued Hopfield-style attractor landscape. The paper proposes the Soma-Field Model as a theoretical and computational architecture for modelling emotional regulation, trauma-like attractors, and body-coupled dynamics; it is a research model rather than a clinical validation.
  keywords: [Soma-Field, emotional dynamics, Hopfield network, trauma modelling, tensor field, attractor landscape, computational psychology]

P2:
  upload_type: publication
  publication_type: article
  description: >-
    A quantum-topological extension of the Soma-Field model motivated by Penrose's question about classical computation. The associated QUANT-EXP-1 result is described as an exact 8-qubit statevector simulation of a model Hopfield instance, not as D-Wave hardware, biological evidence, or a therapeutic claim.
  keywords: [quantum simulation, Soma-Field, Penrose, Hopfield network, attractor barrier, statevector simulation, trauma model]

P3:
  upload_type: publication
  publication_type: article
  description: >-
    A methodology paper naming mathematical co-identification: the disciplined recognition that a mathematical object in one domain can sometimes be treated as the same object in another domain under explicitly stated assumptions. The paper frames theorem import as assumption-bound rather than proof by analogy.
  keywords: [mathematical co-identification, methodology, philosophy of science, type matching, theorem import, structural analogy]

P4:
  upload_type: publication
  publication_type: article
  description: >-
    A programme synthesis connecting the Soma-Field papers, Lean proof files, computational simulations, instrument work, and interpretive applications. It presents the research programme, its method, and its computational tests while keeping proof status, simulation status, and clinical status explicit.
  keywords: [Soma-Field, research programme, mathematical modelling, computational test, Lean 4, emotional dynamics]

P5:
  upload_type: publication
  publication_type: article
  description: >-
    A substrate-oriented paper asking what biological media could constrain a Soma-Field model in living tissue. It reviews biotensegrity, fascial-interstitial continuity, and biofield physiology as possible empirical constraints, while treating the Soma-Field as a theoretical and computational framework rather than a validated biological mechanism.
  keywords: [biotensegrity, fascia, interoception, somatic field, biofield physiology, theoretical biology, trauma model]

P6:
  upload_type: publication
  publication_type: book
  description: >-
    A lay-accessible introduction to the Soma-Field model of emotion, trauma, and embodied change. It presents the model in narrative form for general readers and practitioners, without claiming clinical efficacy or peer-reviewed validation.
  keywords: [Soma-Field, trauma, embodied change, popular science, emotional dynamics, lived experience]

P7:
  upload_type: publication
  publication_type: article
  description: >-
    A patient-perspective and autoethnographic paper that situates the Soma-Field model inside lived experience. The account is offered as reflective research and model motivation, not as general clinical evidence or treatment guidance.
  keywords: [patient perspective, autoethnography, Soma-Field, trauma studies, lived experience, emotional field]

P8:
  upload_type: publication
  publication_type: other
  description: >-
    An abstract film definition that treats a film as a trajectory through an emotional field. The work specifies score-like structures, threshold events, and adaptive rendering concepts for affective media rather than reporting an empirical experiment.
  keywords: [The Tensor, affective media, abstract film, emotional score, Soma-Field, generative art]

P9:
  upload_type: publication
  publication_type: article
  description: >-
    A dynamical model of music-induced affect that extends the valence-arousal circumplex into a field trajectory with attractors, forcing terms, and memory. The paper links BRECVEMA mechanisms to a Soma-Field-style model and proposes instrument and replication pathways; it does not claim completed multi-operator validation.
  keywords: [music psychology, affect dynamics, BRECVEMA, Soma-Field, Langevin dynamics, emotional attractors]

P10:
  upload_type: publication
  publication_type: article
  description: >-
    A time-dependent formulation of the Universal Somatic Field using model retarded Green functions, relaxation times, transition-rate estimates, and a somatic memory kernel. Lean support is theorem-specific and assumption-bound rather than a proof of the whole physical theory.
  keywords: [temporal dynamics, retarded Green function, somatic memory kernel, relaxation time, WKB, Universal Somatic Field]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P11:
  upload_type: publication
  publication_type: article
  description: >-
    A scale-invariant Green-function architecture for the Zoomable Universal Somatic Field across twenty scale levels. The work proposes a shared propagator form and type-level scale dial; cross-scale equivalence and physical interpretation remain modelling hypotheses with stated proof obligations.
  keywords: [scale invariance, Green function, Universal Somatic Field, zoom operator, Hopfield, Lean 4, CEMI]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P12:
  upload_type: publication
  publication_type: article
  description: >-
    Benchmark designs and scaffolds for selected Universal Somatic Field model behaviours, including Hopfield comparisons, corrupted-character tests, synchronisation analogies, hysteresis, and a software analogue of QUANT-EXP-1. The benchmarks inspect consequences of formal assumptions and do not validate physical or clinical claims.
  keywords: [Hopfield network, benchmark scaffolds, MNIST, Kuramoto, GHZ, hysteresis, phase transition, Lean 4]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P13:
  upload_type: publication
  publication_type: article
  description: >-
    The Field-Modulated Hopfield Network (FM-HN), a model architecture in which a somatic field modulates inverse temperature and weights at runtime. The paper proves a correspondence limit in the model and proposes ADHD-, ASC-, and C-PTSD-like operator regimes as hypotheses, not diagnostic claims.
  keywords: [Hopfield network, limbic field, CEMI, FM-HN, correspondence principle, somatic field, Lean 4]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P14:
  upload_type: publication
  publication_type: article
  description: >-
    A free-Gaussian Universal Somatic Field model is identified with the massive Gaussian Free Field under a stated m ↔ k assumption, allowing imported OSforGFF Lean theorem applications for the Osterwalder-Schrader axioms. The record states that wider project proof status is theorem-specific, includes axioms, and includes seven real sorries elsewhere.
  keywords: [Osterwalder-Schrader axioms, Euclidean QFT, Gaussian Free Field, reflection positivity, Lean 4, constructive QFT]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P15:
  upload_type: publication
  publication_type: article
  description: >-
    A research-programme paper identifying proof obligations for Osterwalder-Schrader axioms in the interacting, Hopfield-coupled Universal Somatic Field. It gives provisional reductions for limited cases and explicitly leaves ultraviolet regularisation, thermodynamic limits, and multi-component control as open work.
  keywords: [interacting QFT, Hopfield coupling, reflection positivity, phi-4 theory, Glimm-Jaffe, constructive QFT, proof programme]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P16:
  upload_type: publication
  publication_type: article
  description: >-
    A modelling exercise applying a Green-function propagator form to geographic substrates. Worked examples include Estuary English, ring-necked parakeet murmurations, and the Klöntalersee basin; substrate equivalence is presented as a testable hypothesis rather than an established identity.
  keywords: [geography, wave propagation, Green function, scale invariance, landscape, active matter, Universal Somatic Field]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P17:
  upload_type: publication
  publication_type: article
  description: >-
    An interpretive bridge between Gestalt psychotherapy, Russellian neutral monism, type theory, and Soma-Field mathematics. The paper frames clinical field concepts as assumption-bound model comparisons rather than a closed proof of equivalence with quantum field theory.
  keywords: [Gestalt, neutral monism, Russell, Soma-Field, type theory, clinical field, attractor]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P18:
  upload_type: publication
  publication_type: article
  description: >-
    A single longitudinal N=1 case study proposing the pre-verbal manifold as a formal object for early-life neurodevelopmental trajectories. The paper explicitly treats autism, ADHD, attachment, and complex PTSD categories as possible projections under study, not as claims reducible to trauma.
  keywords: [pre-verbal trauma, neurodevelopment, N=1 case study, developmental manifold, complex PTSD, autism, ADHD]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P19:
  upload_type: publication
  publication_type: article
  description: >-
    An idealised field-theoretic reformulation of multi-agent coordination in which a Green-function propagator matrix replaces iterative message passing when the propagator and source state are available. The Lean result is an arithmetic complexity comparison under stated premises, not an empirical swarm validation.
  keywords: [multi-agent systems, swarm coordination, Green function, propagator, brane projection, complexity comparison, Lean 4]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P20:
  upload_type: publication
  publication_type: article
  description: >-
    A scale-invariant Universal Somatic Field architecture in which Green functions are treated as impulse responses across twenty scale levels. The 11-dimensional decomposition is presented as structurally analogous to M-theory compactification under modelling assumptions, not as a derivation from M-theory.
  keywords: [Universal Somatic Field, Green function, scale invariance, harmonic oscillator, 11-dimensional model, dimensional decomposition]
  related_identifiers:
    - {identifier: "10.5281/zenodo.20460771", scheme: doi, relation: isPartOf, resource_type: publication}

P21:
  upload_type: publication
  publication_type: article
  description: >-
    A speculative cosmology paper proposing a model expression for the cosmological constant as a vacuum amplitude of the Universal Somatic Field tensor. The numerical comparison to Planck 2018 is presented as model-derived and approximate, with open geometry and general-relativity formalisation requirements.
  keywords: [cosmological constant, vacuum amplitude, Universal Somatic Field, compactification model, Planck 2018, dark energy]
  related_identifiers:
    - {identifier: "10.5281/zenodo.21873942", scheme: doi, relation: isPartOf, resource_type: publication}

P22:
  upload_type: publication
  publication_type: article
  description: >-
    A speculative cosmology paper identifying dark matter with the spatial block vacuum of the Universal Somatic Field under stated compactification assumptions. The Ω_DM = 3/11 comparison is a leading-order model comparison to Planck 2018, not an observed detection or established particle alternative.
  keywords: [dark matter, spatial vacuum, Omega_DM, Universal Somatic Field, compactification model, Planck 2018, cosmology]
  related_identifiers:
    - {identifier: "10.5281/zenodo.21873942", scheme: doi, relation: isPartOf, resource_type: publication}

P23:
  upload_type: publication
  publication_type: article
  description: >-
    A programme paper proposing that [T]-Theory can be studied as a fixed point of its own subject matter: its cultural and digital propagation is modelled with the same kind of Green-function language used elsewhere in the programme. This is a programme hypothesis, not proof of substrate equivalence.
  keywords: ["[T]-Theory", fixed point, cultural propagation, Universal Somatic Field, self-reference, Green function, research programme]
  related_identifiers:
    - {identifier: "10.5281/zenodo.21873942", scheme: doi, relation: isPartOf, resource_type: publication}

P24:
  upload_type: publication
  publication_type: article
  description: >-
