  keywords: [G2 symmetry, BRECVEMA, emotional tensor, symmetry breaking, coupling matrix, Universal Somatic Field, compact-sector interpretation]
  related_identifiers:
    - {identifier: "10.5281/zenodo.21873942", scheme: doi, relation: isPartOf, resource_type: publication}

